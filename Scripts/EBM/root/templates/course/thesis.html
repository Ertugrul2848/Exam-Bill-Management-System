{% extends 'base.html' %}
{% block extra_css %}
<style>
table {
        width: 800px;
        margin-top: 100px;
        font-size: 18px;
        text-align: center;
      }
      .con form h2 {
        margin-bottom: -50px;
        background: #087f5b;
        color: white;
        padding: 10px;
      }
      td,
      th {
        padding: 16px 24px;
        text-align: center;
        border: 1px solid black;
      }

      thead tr {
        background-color: #087f5b;
        color: #fff;
      }
      tr {
        text-align: center;
        border: 2px solid black;
        background-color: #e9ecef;
      }
      input {
        text-align: center;
        border: none;
        outline: none;
      }
      .button > * {
        margin-top: 20px;
        background: #087f5b;
        padding: 10px;
        width: 150px;
        color: white;
        font-size: 19px;
      }
</style>
{% endblock extra_css %}
{% block content %}
<div class="con">
      <form method="POST">
        <h2>Thesis Evaluation</h2>
        {%csrf_token%}
        <table class="table table-striped table-bordered">
          <thead>
            <tr>
              <th>Teacher Name</th>
              <th>Paper No</th>
            </tr>
          </thead>
          {%for o in tea%}
          <tr>
            <th>{{o.faculty.name}}</th>
            <th>
              <input class="form-control" type="number" min="0" value="{{o.paperNo}}" name="paper" />
            </th>
          </tr>
          {%endfor%}
        </table>
        <div class="button">
          <button class="btn btn-primary" name="cancel" type="submit">Cancel</button>
          <button class="btn btn-primary" name="save" type="submit">Save</button>
        </div>
      </form>
    </div>
{% endblock content %}
