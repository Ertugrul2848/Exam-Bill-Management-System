{% extends 'base.html' %}
{% block title %}Create Course{% endblock title %}
{% block content %}
<div class="container" style="margin-top: 40px; max-width: 600px;">
  <a href="javascript:history.back()" class="btn btn-default" style="margin-bottom: 20px;">
    <span class="glyphicon glyphicon-arrow-left"></span> Back
  </a>
  <div class="panel panel-primary">
    <div class="panel-heading"><h3 class="panel-title">Create Course</h3></div>
    <div class="panel-body">
      <form method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label>Course Name</label>
          <input class="form-control" type="text" name="name" placeholder="Enter Course Name" required />
        </div>
        <div class="form-group">
          <label>Course Code</label>
          <input class="form-control" type="number" name="code" placeholder="Enter Course Code" required />
        </div>
        <div class="form-group">
          <label>Credits</label>
          <input class="form-control" type="number" name="credit" placeholder="Enter Credits" required />
        </div>
        <div class="form-group">
          <label>Course Type</label>
          <select class="form-control" name="type" required>
            <option selected disabled value="">-- Select Type --</option>
            <option value="1">Theory</option>
            <option value="2">Lab</option>
            <option value="3">Viva</option>
          </select>
        </div>
        <div class="form-group">
          <label>Internal Examiner</label>
          <select class="form-control" name="internal" required>
            <option selected disabled value="">-- Select Internal --</option>
            {% for o in ob %}
            <option value="{{ o.email }}">{{ o.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>External Examiner</label>
          <select class="form-control" name="external" required>
            <option selected disabled value="">-- Select External --</option>
            {% for o in ob %}
            <option value="{{ o.email }}">{{ o.name }}</option>
            {% endfor %}
          </select>
        </div>
        <button class="btn btn-primary btn-block" type="submit">
          <span class="glyphicon glyphicon-ok"></span> Create Course
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
