{% extends 'base.html' %}
{% block title %}Create Course{% endblock title %}
{% block content %}
<div class="container" style="margin-top: 40px; max-width: 600px;">
  <a href="javascript:history.back()" class="btn btn-default" style="margin-bottom: 20px;">
    <span class="glyphicon glyphicon-arrow-left"></span> Back
  </a>
  <div class="panel panel-primary">
    <div class="panel-heading"><h3 class="panel-title">Create Course</h3></div>
    <div class="panel-body">
      <form method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label>Course Code</label>
          {% if course_codes %}
          <select class="form-control" name="code" id="code-select" required>
            <option selected disabled value="">-- Select Course Code --</option>
            {% for cc in course_codes %}
            <option value="{{ cc.code }}" data-name="{{ cc.name }}">{{ cc.code }} — {{ cc.name }}</option>
            {% endfor %}
          </select>
          {% else %}
          <input class="form-control" type="number" name="code" placeholder="Enter Course Code" required />
          {% endif %}
        </div>
        <div class="form-group">
          <label>Course Name</label>
          <input class="form-control" type="text" name="name" id="name-input" placeholder="Enter Course Name" required />
        </div>
        <div class="form-group">
          <label>Credits</label>
          {% if accepted_credits %}
          <select class="form-control" name="credit" required>
            <option selected disabled value="">-- Select Credits --</option>
            {% for ac in accepted_credits %}
            <option value="{{ ac.value }}">{{ ac.value }}</option>
            {% endfor %}
          </select>
          {% else %}
          <input class="form-control" type="number" name="credit" placeholder="Enter Credits" required />
          {% endif %}
        </div>
        <div class="form-group">
          <label>Course Type</label>
          <select class="form-control" name="type" required>
            <option selected disabled value="">-- Select Type --</option>
            <option value="1">Theory</option>
            <option value="2">Lab</option>
            <option value="3">Viva</option>
          </select>
        </div>
        <div class="form-group">
          <label>Internal Examiner</label>
          <select class="form-control" name="internal" required>
            <option selected disabled value="">-- Select Internal --</option>
            {% for o in ob %}
            <option value="{{ o.email }}">{{ o.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>External Examiner</label>
          <select class="form-control" name="external" required>
            <option selected disabled value="">-- Select External --</option>
            {% for o in ob %}
            <option value="{{ o.email }}">{{ o.name }}</option>
            {% endfor %}
          </select>
        </div>
        <button class="btn btn-primary btn-block" type="submit">
          <span class="glyphicon glyphicon-ok"></span> Create Course
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
{% block extra_js %}
<script>
$('#code-select').on('change', function() {
  var name = $(this).find(':selected').data('name');
  if (name) {
    $('#name-input').val(name);
  }
});

$('form').on('submit', function(e) {
  var internal = $('select[name="internal"]').val();
  var external = $('select[name="external"]').val();
  if (internal && external && internal === external) {
    e.preventDefault();
    alert('Internal and external examiner cannot be the same person.');
  }
});
</script>
{% endblock extra_js %}
