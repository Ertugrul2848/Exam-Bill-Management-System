{% extends 'base.html' %}
{% block title %}Thesis Supervision{% endblock title %}
{% block content %}
<div class="container" style="margin-top: 40px;">
  <a href="javascript:history.back()" class="btn btn-default" style="margin-bottom: 20px;">
    <span class="glyphicon glyphicon-arrow-left"></span> Back
  </a>
  <div class="panel panel-primary">
    <div class="panel-heading"><h3 class="panel-title">Thesis Supervision</h3></div>
    <div class="panel-body">
      <form method="POST" id="supervisingForm">
        {% csrf_token %}
        <table class="table table-striped table-bordered">
          <thead>
            <tr>
              <th>Teacher Name</th>
              <th>Students</th>
            </tr>
          </thead>
          <tbody>
            {% for o in tea %}
            <tr>
              <td>{{ o.faculty.name }}</td>
              <td>
                <input class="form-control supervising-field" type="number" min="0" value="{{ o.studentNo }}" name="student" data-original="{{ o.studentNo }}" />
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
        <div class="text-right">
          <button class="btn btn-default" name="cancel" type="submit">Cancel</button>
          <button class="btn btn-primary" name="save" type="submit" id="supervisingSaveBtn" disabled>Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock content %}

{% block extra_js %}
<script>
// Enable Save button only when a student number changes
$(function() {
  var btn = $('#supervisingSaveBtn');
  $('#supervisingForm').on('change input', '.supervising-field', function() {
    var changed = false;
    $('.supervising-field').each(function() {
      if ($(this).val() !== String($(this).data('original'))) {
        changed = true;
      }
    });
    btn.prop('disabled', !changed);
  });
});
</script>
{% endblock extra_js %}
