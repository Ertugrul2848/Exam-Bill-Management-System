{% extends 'base.html' %}
{% block title %}Semester Bill{% endblock title %}
{% block content %}
<div class="container" style="margin-top: 40px; max-width: 500px;">
  <div class="card border-primary">
    <div class="card-header"><h3 class="card-title">View Semester Bill</h3></div>
    <div class="card-body">
      {% if sessions %}
      <form method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label>Session</label>
          <select class="form-control" name="session" id="session-select2" required>
            <option selected disabled value="">-- Select Session --</option>
            {% for s in sessions %}
            <option value="{{ s.year }}">{{ s.year }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Semester</label>
          <select class="form-control" name="semester" id="semester-select2" required>
            <option selected disabled value="">-- Select Session First --</option>
          </select>
        </div>
        <button class="btn btn-primary btn-block" type="submit">
          <span class="bi bi-search"></span> View Bill
        </button>
      </form>
      {% else %}
      <div class="alert alert-warning">
        <span class="bi bi-info-circle"></span> No sessions available.
      </div>
      {% endif %}
    </div>
  </div>
</div>
{% endblock content %}
{% block extra_js %}
<script>
var semesters2 = {
  {% for sem in semesters %}
  "{{ sem.session.year }}_{{ sem.semId }}": "{{ sem.get_display_name }}",
  {% endfor %}
};
$('#session-select2').on('change', function() {
  var year = $(this).val();
  var $sem = $('#semester-select2');
  $sem.html('<option selected disabled value="">-- Select Semester --</option>');
  $.each(semesters2, function(key, label) {
    if (key.startsWith(year + '_')) {
      var semId = key.split('_')[1];
      $sem.append('<option value="' + semId + '">' + label + '</option>');
    }
  });
});
</script>
{% endblock extra_js %}
