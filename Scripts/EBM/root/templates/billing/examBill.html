{% extends 'base.html' %}
{% block title %}Teacher Bill{% endblock title %}
{% block content %}
<div class="container" style="margin-top: 40px; max-width: 500px;">
  <div class="panel panel-primary">
    <div class="panel-heading"><h3 class="panel-title">View Your Bill</h3></div>
    <div class="panel-body">
      <form method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label>Session</label>
          <input class="form-control" type="number" name="session" min="1900" placeholder="Enter Session Year" required />
        </div>
        <div class="form-group">
          <label>Semester</label>
          <select class="form-control" name="semester" required>
            <option selected disabled value="">-- Select Semester --</option>
            <option value="10">Masters 2nd Semester</option>
            <option value="9">Masters 1st Semester</option>
            <option value="8">4th Year 2nd Semester</option>
            <option value="7">4th Year 1st Semester</option>
            <option value="6">3rd Year 2nd Semester</option>
            <option value="5">3rd Year 1st Semester</option>
            <option value="4">2nd Year 2nd Semester</option>
            <option value="3">2nd Year 1st Semester</option>
            <option value="2">1st Year 2nd Semester</option>
            <option value="1">1st Year 1st Semester</option>
          </select>
        </div>
        <button class="btn btn-primary btn-block" type="submit">
          <span class="glyphicon glyphicon-search"></span> View Bill
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
