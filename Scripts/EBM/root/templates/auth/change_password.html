{% extends 'base.html' %}
{% block title %}Change Password — EBM System{% endblock title %}
{% block content %}
<div class="container" style="max-width: 500px; margin-top: 40px;">
  <div class="panel panel-default">
    <div class="panel-heading">
      <h3 class="panel-title"><span class="glyphicon glyphicon-lock"></span> Change Password</h3>
    </div>
    <div class="panel-body">

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible" role="alert">
            <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      <form method="POST">
        {% csrf_token %}

        <div class="form-group">
          <label for="current_password">Current Password</label>
          <input type="password" class="form-control" id="current_password" name="current_password" required autofocus>
        </div>

        <div class="form-group">
          <label for="new_password">New Password</label>
          <input type="password" class="form-control" id="new_password" name="new_password" required>
          <p class="help-block">Minimum 8 characters.</p>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm New Password</label>
          <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
        </div>

        <button type="submit" class="btn btn-primary">
          <span class="glyphicon glyphicon-ok"></span> Change Password
        </button>
        <a href="{% url 'profile' %}" class="btn btn-default">
          <span class="glyphicon glyphicon-arrow-left"></span> Back to Profile
        </a>
      </form>

    </div>
  </div>
</div>
{% endblock content %}
