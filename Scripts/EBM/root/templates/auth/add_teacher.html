{% extends 'base.html' %}
{% block title %}Add Teacher Directly{% endblock title %}
{% block content %}
<div class="container" style="margin-top: 40px;">
  <div class="row">
    <div class="col-md-6 col-md-offset-3">

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <div class="panel panel-default">
        <div class="panel-heading">
          <h3 class="panel-title">Add Teacher Directly</h3>
        </div>
        <div class="panel-body">
          <form method="post">
            {% csrf_token %}

            <div class="form-group">
              <label for="name">Full Name</label>
              <input type="text" class="form-control" id="name" name="name" placeholder="Enter full name" required>
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="Enter email address" required>
            </div>

            <div class="form-group">
              <label for="title">Title</label>
              <select class="form-control" id="title" name="title" required>
                <option value="">-- Select Title --</option>
                <option value="Professor">Professor</option>
                <option value="Associate Professor">Associate Professor</option>
                <option value="Assistant Professor">Assistant Professor</option>
                <option value="Lecturer">Lecturer</option>
              </select>
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" class="form-control" id="password" name="password" placeholder="Set a password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
              <span class="glyphicon glyphicon-plus"></span> Add Teacher
            </button>
          </form>
        </div>
      </div>

      <a href="{% url 'pending_registrations' %}" class="btn btn-default">
        <span class="glyphicon glyphicon-arrow-left"></span> Back to Pending Registrations
      </a>

    </div>
  </div>
</div>
{% endblock content %}
