{% extends 'base.html' %}
{% block title %}My Profile — EBM System{% endblock title %}
{% block content %}
<div class="container" style="max-width: 600px; margin-top: 40px;">
  <div class="panel panel-default">
    <div class="panel-heading">
      <h3 class="panel-title"><span class="glyphicon glyphicon-user"></span> My Profile</h3>
    </div>
    <div class="panel-body">

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible" role="alert">
            <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      <form method="POST">
        {% csrf_token %}

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" class="form-control" id="name" name="name" value="{{ fac.name }}" required>
        </div>

        <div class="form-group">
          <label for="title">Title</label>
          <select class="form-control" id="title" name="title" required>
            <option value="">-- Select Title --</option>
            {% for value, label in title_choices %}
              <option value="{{ value }}" {% if fac.title == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" class="form-control" id="email" name="email" value="{{ fac.email }}" readonly>
        </div>

        <button type="submit" class="btn btn-primary">
          <span class="glyphicon glyphicon-floppy-disk"></span> Save Changes
        </button>
        <a href="{% url 'home' %}" class="btn btn-default">
          <span class="glyphicon glyphicon-arrow-left"></span> Back
        </a>
      </form>

    </div>
  </div>
</div>
{% endblock content %}
