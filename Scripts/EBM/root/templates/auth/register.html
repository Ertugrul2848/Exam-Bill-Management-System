{% extends 'base.html' %}
{% block title %}Register — EBM System{% endblock title %}
{% block navbar %}{% endblock navbar %}
{% block content %}
<div class="container" style="margin-top: 80px; max-width: 450px;">
  <div class="card border-success">
    <div class="card-header"><h3 class="card-title">Register as Teacher</h3></div>
    <div class="card-body">
      <form method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label>Full Name</label>
          <input class="form-control" type="text" name="name" placeholder="Enter your full name" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input class="form-control" type="email" name="email" placeholder="you@university.edu" required />
        </div>
        <div class="form-group">
          <label>Title</label>
          <select class="form-control" name="title" required>
            <option selected disabled value="">-- Select Title --</option>
            <option value="Professor">Professor</option>
            <option value="Associate Professor">Associate Professor</option>
            <option value="Assistant Professor">Assistant Professor</option>
            <option value="Lecturer">Lecturer</option>
          </select>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input class="form-control" type="password" name="password" placeholder="Create a password" required />
        </div>
        <button class="btn btn-success btn-block" type="submit">
          <span class="bi bi-send"></span> Submit Application
        </button>
      </form>
      <hr />
      <p class="text-center">Already registered? <a href="{% url 'log' %}">Login here</a></p>
    </div>
  </div>
</div>
{% endblock content %}
